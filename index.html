<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>calc</title>
  </head>
  <body>
    <div
      class="bg-dark w-100 vh-100 d-flex flex-row justify-content-center align-items-center"
    >
      <div
        class="calc  d-flex flex-column justify-content-between align-items-center"
      >
        <div
          class="divc w-100 d-flex justify-content-center align-items-center"
        >
          <input type="text" class="input" name="" value="" id="inp" />
        </div>
        <div
          class="w-100 d-flex flex-column justify-content-around align-items-center gap-3"
        >
          <div class="divb d-flex justify-content-around">
            <button class="buttons BTN bg-light" type="button">7</button>
            <button class="buttons BTN bg-light" type="button">8</button>
            <button class="buttons BTN bg-light" type="button">9</button>
            <button class="buttons BTN bg-light" type="button">+</button>
          </div>
          <div class="divb d-flex justify-content-around">
            <button class="buttons BTN bg-light" type="button">4</button>
            <button class="buttons BTN bg-light" type="button">5</button>
            <button class="buttons BTN bg-light" type="button">6</button>
            <button class="buttons BTN bg-light" type="button">-</button>
          </div>
          <div class="divb d-flex justify-content-around">
            <button class="buttons BTN bg-light" type="button">1</button>
            <button class="buttons BTN bg-light" type="button">2</button>
            <button class="buttons BTN bg-light" type="button">3</button>
            <button class="buttons BTN bg-light" type="button">*</button>
          </div>

          <div class="divb d-flex justify-content-around">
            <button class="buttons BTN bg-light" type="button">0</button>
            <button class="buttons BTN bg-light" type="button">/</button>
            <button id="btnd" class="BTN bg-danger border-danger" type="button">
              DEL
            </button>
            <button id="btnc" class="BTN bg-danger border-danger" type="button">C</button>
          </div>

          <div  class="divb d-flex justify-content-center">
            <button
              type="button"
              class=" w-100 h-75 btnE text-dark bg-primary btn btn-secondary btn-lg"
           id="btne"
              >
              =
            </button>
          </div>
        </div>
      </div>
     
    </div>

    <script src="js/bootstrap.bundle.js"></script>
    <script src="index.js"></script>
  </body>
</html>
